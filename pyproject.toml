[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booktools"
version = "0.3.0"
description = "Project-agnostic book production tools: word stats, POD interior PDF, EPUB3, cover spine/wrap, per-book local GraphRAG research library with citations."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6",
    "pypdf>=4",
    "weasyprint>=62",
    "numpy>=1.26",
    "networkx>=3",
    "scikit-learn>=1.3",
    "trafilatura>=1.8",
    "pymupdf>=1.23",
]

[project.optional-dependencies]
docx = ["python-docx>=1"]

[project.scripts]
booktools = "booktools.__main__:main"

[tool.setuptools]
packages = ["booktools", "booktools.research"]

[tool.setuptools.package-data]
booktools = ["styles/*.css", "styles/*.lua", "styles/csl/*.csl"]
