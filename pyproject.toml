[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booktools"
version = "0.2.0"
description = "Project-agnostic book production tools: word stats, POD interior PDF, EPUB3, cover spine/wrap."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6",
    "pypdf>=4",
    "weasyprint>=62",
]

[project.scripts]
booktools = "booktools.__main__:main"

[tool.setuptools]
packages = ["booktools"]

[tool.setuptools.package-data]
booktools = ["styles/*.css"]
