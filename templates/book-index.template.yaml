# Copy to <new-book>/context/book-index.yaml and fill in.
# Leave a value as null if unknown: booktools will stop and print an
# AGENT ACTION REQUIRED block telling the agent what to look up.
# Never copy printer numbers from another book without re-verifying them.

book:
  slug: my-book                      # used for dist/ filenames
  title: null
  subtitle: null
  author: null
  language: en-US
  rights: null
  publisher: null
  site: null                         # optional; seeds the EPUB identifier
  isbn_ebook: null                   # optional; used as EPUB identifier if set

production:
  trim: {width_in: null, height_in: null}
  interior: {ink: null, paper: null}  # e.g. bw / white
  page_ceiling: null                  # optional hard limit; build exits 3 if exceeded
  word_target: null                   # optional
  budget_tolerance: 0.10
  epub:
    css: kindle.css                   # library default; or a project-relative path
    cover: null                       # default: assets/cover/ebook-cover.jpg|png

  print_targets:                      # one block per printer; key = --target name
    kdp:
      label: "Amazon KDP"
      css: pod_kdp.css                # library default; or a project-relative path
      margins_in: {top: null, bottom: null, inside: null, outside: null}
      bleed_in: null                  # cover bleed per edge
      spine_in_per_page: null         # depends on paper + ink
      safe_in: null
      spine_safe_in: null
      spine_text_min_pages: null      # optional
      spine_text_min_in: null         # optional
      barcode_in: [null, null]        # [width, height]
      min_pages: null
      even_pages: true
      specs_source: null              # page/doc the values came from
      specs_verified: null            # YYYY-MM-DD; warns if unset or >180 days old
    ingram:
      label: "IngramSpark"
      css: pod_ingram.css
      margins_in: {top: null, bottom: null, inside: null, outside: null}
      bleed_in: null
      spine_in_per_page: null
      safe_in: null
      spine_safe_in: null
      spine_text_min_pages: null
      spine_text_min_in: null
      barcode_in: [null, null]
      min_pages: null
      even_pages: true
      specs_source: null
      specs_verified: null

research:                             # booktools research ... (local OpenAI-compatible server)
  endpoint: null                      # e.g. http://localhost:1234/v1 (LM Studio)
  models: {embed: null, extractor: null, judge: null}   # role names from MODELS.md, or model ids
  notes_dir: context/raw-material
  citation_style: chicago-notes-bibliography
  judge_min_score: 2

chapters: []                          # managed by the drafting workflow
